<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll2PDF stripe-seam fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
    .band { height: 200px; display: flex; align-items: center; justify-content: center; color: white; font: 800 24px system-ui; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    /* Distinct flat colors so any white seam line between capture bands is obvious. */
    .b1 { background: #d9455f; }
    .b2 { background: #2f7fd1; }
    .b3 { background: #37a05a; }
    .b4 { background: #e0a62e; }
    .b5 { background: #7a55c9; }
    .b6 { background: #2fa5a5; }
    .b7 { background: #d9702f; }
    .b8 { background: #4f6db3; }
    .b9 { background: #c05b8b; }
    .b10 { background: #5c8f2f; }
    .b11 { background: #b3456d; }
    .b12 { background: #3967c0; }
    .b13 { background: #c9a227; }
    .b14 { background: #3f8f5f; }
    .b15 { background: #7d4fd1; }
    .b16 { background: #2f9fb0; }
    .b17 { background: #c05b3f; }
    .b18 { background: #5a6fb8; }
    .b19 { background: #a85b9b; }
    .b20 { background: #4f8f2f; }
    .b21 { background: #c93f6d; }
    .b22 { background: #2f7fd1; }
    .b23 { background: #37a05a; }
    .b24 { background: #d9455f; }
  </style>
</head>
<body>
  <div class="band b1">Stripe 01</div>
  <div class="band b2">Stripe 02</div>
  <div class="band b3">Stripe 03</div>
  <div class="band b4">Stripe 04</div>
  <div class="band b5">Stripe 05</div>
  <div class="band b6">Stripe 06</div>
  <div class="band b7">Stripe 07</div>
  <div class="band b8">Stripe 08</div>
  <div class="band b9">Stripe 09</div>
  <div class="band b10">Stripe 10</div>
  <div class="band b11">Stripe 11</div>
  <div class="band b12">Stripe 12</div>
  <div class="band b13">Stripe 13</div>
  <div class="band b14">Stripe 14</div>
  <div class="band b15">Stripe 15</div>
  <div class="band b16">Stripe 16</div>
  <div class="band b17">Stripe 17</div>
  <div class="band b18">Stripe 18</div>
  <div class="band b19">Stripe 19</div>
  <div class="band b20">Stripe 20</div>
  <div class="band b21">Stripe 21</div>
  <div class="band b22">Stripe 22</div>
  <div class="band b23">Stripe 23</div>
  <div class="band b24">Stripe 24</div>
</body>
</html>
