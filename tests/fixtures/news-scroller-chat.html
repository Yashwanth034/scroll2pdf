<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll2PDF news-scroller chat fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0f1420; color: #e7ebf3; font: 15px/1.5 system-ui, sans-serif; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    /* The whole pane is ONE scroll container; the channel header and the
       broadcast composer are sticky bars INSIDE it, so they overlay the top
       and bottom of every viewport frame while it scrolls. */
    #chat-scroll { flex: 1; overflow-y: auto; position: relative; min-height: 0; background: #161d2c; }
    .topbar { position: sticky; top: 0; z-index: 5; height: 54px; display: flex; align-items: center; gap: 12px; margin: 0 32px; padding: 0 16px; background: #1b6ef5; border-bottom: 1px solid #2b3650; }
    .topbar .title { font-size: 17px; font-weight: 800; color: #f4f7ff; }
    .topbar .live { color: #7ec9ff; font-size: 12px; }
    .composer { position: sticky; bottom: 0; z-index: 5; height: 60px; display: flex; align-items: center; gap: 10px; margin: 0 32px; padding: 0 16px; background: #1b6ef5; border-top: 1px solid #2b3650; }
    .composer .field { flex: 1; height: 34px; border-radius: 17px; background: #0f1420; border: 1px solid #2b3650; }
    .composer .send { width: 34px; height: 34px; border-radius: 50%; background: #2f6fed; }
    body.inset-chrome .topbar { top: 36px; }
    body.inset-chrome .composer { bottom: 36px; }
    .msg { margin: 12px 14px; padding: 14px 16px; border-radius: 12px; background: #1e2740; border: 1px solid #2b3650; }
    .msg:nth-child(odd) { background: #1c2838; }
    .msg .who { color: #8ab4ff; font-weight: 700; }
    .marker { margin: 14px; padding: 24px; text-align: center; border-radius: 12px; background: #123f2f; color: #6ff5b0; font-weight: 800; }
  </style>
</head>
<body>
  <div class="app">
    <div id="chat-scroll">
      <div class="topbar">
        <span class="title">World News</span>
        <span class="live" id="live">● Live</span>
      </div>
      <div id="messages"></div>
      <div class="marker">CHAT BOTTOM MARKER</div>
      <div class="composer">
        <div class="field"></div>
        <div class="send"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get("inset") === "1") document.body.classList.add("inset-chrome");
      const target = Number(params.get("height") || 14000);
      const messages = document.getElementById("messages");
      const frag = document.createDocumentFragment();
      let total = 0;
      let index = 1;
      while (total < target - 300) {
        const row = document.createElement("div");
        row.className = "msg";
        row.setAttribute("data-message-id", String(index));
        row.innerHTML = "<span class='who'>Reporter " + String(index).padStart(3, "0") + "</span> — news update number " + index;
        frag.appendChild(row);
        total += 76;
        index += 1;
      }
      messages.appendChild(frag);
      window.__chatSectionCount = index - 1;
      // Live-updating element in the header: changes every second so the DOM
      // identity of the top bar is stable but its text signature is volatile.
      const live = document.getElementById("live");
      let tick = 0;
      setInterval(function () {
        tick += 1;
        live.textContent = "● Live " + tick + " · " + new Date().toLocaleTimeString();
      }, 1000);
      window.__newsChatHeight = document.getElementById("chat-scroll").scrollHeight;
      // Put the rendered app in the middle of a >10,000-node DOM to model
      // Telegram's large virtualized shell. A first/last bounded DOM scan
      // cannot see the header or composer; rendered edge hit testing must.
      if (params.get("buried") === "1") {
        const app = document.querySelector(".app");
        const before = document.createDocumentFragment();
        const after = document.createDocumentFragment();
        for (let number = 0; number < 5100; number += 1) {
          const leading = document.createElement("i");
          leading.hidden = true;
          before.appendChild(leading);
          const trailing = document.createElement("i");
          trailing.hidden = true;
          after.appendChild(trailing);
        }
        document.body.insertBefore(before, app);
        document.body.appendChild(after);
      }
    })();
  </script>
</body>
</html>
