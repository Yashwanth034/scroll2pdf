<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scroll2PDF iframe inner page (window-scrolled)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    .band { height: 420px; display: grid; place-items: center; color: white; font: 800 22px system-ui, sans-serif; }
    .band-1 { background: #8b5cf6; }
    .band-2 { background: #06b6d4; }
    .band-3 { background: #f97316; }
    .band-4 { background: #10b981; }
    .band-5 { background: #d946ef; }
    .band-6 { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="band band-1">WINDOW FRAME · BAND 1</div>
  <div class="band band-2">WINDOW FRAME · BAND 2</div>
  <div class="band band-3">WINDOW FRAME · BAND 3</div>
  <div class="band band-4">WINDOW FRAME · BAND 4</div>
  <div class="band band-5">WINDOW FRAME · BAND 5</div>
  <div class="band band-6">WINDOW FRAME · BAND 6 (deepest)</div>
</body>
</html>
