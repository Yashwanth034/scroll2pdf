<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll2PDF long-page fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f3f6fb; color: #152238; }
    .band { height: 220px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #cdd9ec; background: linear-gradient(135deg, #ffffff, #e9f1ff); }
    .band:nth-child(even) { background: linear-gradient(135deg, #f4fff9, #def3e7); }
    .band strong { font-size: 26px; color: #174a9e; letter-spacing: 0.02em; }
    .band:nth-child(even) strong { color: #0b7a4d; }
    .top { height: 140px; display: grid; place-items: center; color: #0d2b6b; background: #dbe7ff; font-size: 22px; font-weight: 850; }
    .bottom { height: 160px; display: grid; place-items: center; color: white; background: #17765a; font-size: 24px; font-weight: 850; }
  </style>
</head>
<body>
  <div class="top">LONG PAGE TOP MARKER</div>
  <!-- Bands are generated by JS below: ~180px of content each. -->
  <div id="bands"></div>
  <div class="bottom">LONG PAGE BOTTOM MARKER</div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      // ?mode=too-long  → the stitched image exceeds Chrome's single-canvas limit
      //                  and must produce a clear, friendly error.
      // (default)       → a long page (~18 000px) that captures successfully.
      const mode = params.get("mode") === "too-long" ? "too-long" : "ok";
      const target = mode === "too-long" ? 40000 : 18000;
      const bands = document.getElementById("bands");
      let total = 140;
      let index = 1;
      const frag = document.createDocumentFragment();
      while (total < target - 160) {
        const band = document.createElement("div");
        band.className = "band";
        band.innerHTML = "<strong>Section " + String(index).padStart(3, "0") + "</strong>";
        frag.appendChild(band);
        total += 222;
        index += 1;
      }
      bands.appendChild(frag);
      window.__longPageMode = mode;
      window.__longPageSections = index - 1;
    })();
  </script>
</body>
</html>
