<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scroll2PDF Short-page Test</title>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
      main { display: grid; min-height: 70vh; place-content: center; background: #dce9ff; color: #10213b; text-align: center; }
      h1 { margin: 0; font-size: clamp(42px, 8vw, 92px); }
      p { font-size: 20px; }
    </style>
  </head>
  <body>
    <main><div><h1>Short page</h1><p>This page should be captured exactly once.</p></div></main>
  </body>
</html>
