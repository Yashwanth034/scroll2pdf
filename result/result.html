<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Scroll2PDF Capture</title>
    <link rel="stylesheet" href="result.css">
  </head>
  <body>
    <header class="result-header">
      <div class="brand-lockup">
        <div class="page-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="eyebrow">Scroll2PDF capture</p>
          <h1 id="result-title">Preparing your capture…</h1>
          <p id="result-dimensions" class="dimensions"></p>
          <p id="result-metadata" class="dimensions"></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="close-result" class="button button--secondary" type="button">Close</button>
        <button id="copy-image" class="button button--secondary" type="button" hidden>Copy Image</button>
        <a id="download-image" class="button button--primary" download aria-disabled="true">Download</a>
      </div>
    </header>

    <section id="editor-toolbar" class="editor-toolbar" aria-label="Image editing tools" hidden>
      <div class="editor-toolbar__rail" role="toolbar" aria-label="Annotate and edit image">
        <button class="editor-tool" type="button" data-editor-tool="select" aria-pressed="true" title="Select and move objects">
          <span aria-hidden="true">↖</span><span>Select</span>
        </button>
        <span class="editor-toolbar__divider" aria-hidden="true"></span>
        <button class="editor-tool" type="button" data-editor-tool="crop" aria-pressed="false" title="Crop image"><span aria-hidden="true">⌗</span><span>Crop</span></button>
        <button class="editor-tool" type="button" data-editor-tool="cut" aria-pressed="false" title="Remove horizontal section"><span aria-hidden="true">✂</span><span>Cut section</span></button>
        <button class="editor-tool" type="button" data-editor-tool="insert" aria-pressed="false" title="Insert blank space"><span aria-hidden="true">↕</span><span>Insert space</span></button>
        <span class="editor-toolbar__divider" aria-hidden="true"></span>
        <button class="editor-tool" type="button" data-editor-tool="arrow" aria-pressed="false" title="Draw arrow"><span aria-hidden="true">➜</span><span>Arrow</span></button>
        <button class="editor-tool" type="button" data-editor-tool="rectangle" aria-pressed="false" title="Draw rectangle"><span aria-hidden="true">□</span><span>Rectangle</span></button>
        <button class="editor-tool" type="button" data-editor-tool="circle" aria-pressed="false" title="Draw circle"><span aria-hidden="true">○</span><span>Circle</span></button>
        <button class="editor-tool" type="button" data-editor-tool="pen" aria-pressed="false" title="Draw freehand"><span aria-hidden="true">✎</span><span>Pen</span></button>
        <button class="editor-tool" type="button" data-editor-tool="highlighter" aria-pressed="false" title="Highlight"><span aria-hidden="true">▰</span><span>Highlight</span></button>
        <button class="editor-tool" type="button" data-editor-tool="text" aria-pressed="false" title="Add text"><span aria-hidden="true">T</span><span>Text</span></button>
        <button class="editor-tool" type="button" data-editor-tool="blur" aria-pressed="false" title="Blur private information"><span aria-hidden="true">▦</span><span>Blur</span></button>
        <span class="editor-toolbar__divider" aria-hidden="true"></span>
        <button id="editor-undo" class="editor-tool editor-tool--compact" type="button" disabled title="Undo"><span aria-hidden="true">↶</span><span>Undo</span></button>
        <button id="editor-redo" class="editor-tool editor-tool--compact" type="button" disabled title="Redo"><span aria-hidden="true">↷</span><span>Redo</span></button>
        <button id="editor-reset" class="editor-tool editor-tool--compact" type="button" disabled title="Reset to original"><span aria-hidden="true">↺</span><span>Reset</span></button>
      </div>
      <div id="editor-context" class="editor-context" hidden></div>
    </section>

    <main>
      <p id="result-status" class="result-status" role="status" aria-live="polite">Loading captured result…</p>
      <section id="pdf-result-card" class="pdf-result-card" aria-label="A4 PDF result" hidden>
        <div class="pdf-sheet" aria-hidden="true">
          <span class="pdf-sheet__fold"></span>
          <span class="pdf-sheet__line"></span>
          <span class="pdf-sheet__line"></span>
          <span class="pdf-sheet__line"></span>
          <strong>PDF</strong>
        </div>
        <div class="pdf-result-copy">
          <p class="eyebrow">A4 document ready</p>
          <h2>Your capture is paginated and ready to save.</h2>
          <p id="pdf-result-summary"></p>
        </div>
      </section>
      <section id="pdf-preview-surface" class="pdf-preview-surface" aria-label="PDF page preview" hidden>
        <div class="pdf-preview-toolbar">
          <span id="pdf-preview-label" class="pdf-preview-label" role="status">Loading preview…</span>
        </div>
        <div class="pdf-preview-frame">
          <iframe id="result-pdf" title="Captured PDF preview"></iframe>
        </div>
      </section>
      <section id="preview-surface" class="preview-surface" aria-label="Full-page capture preview" hidden>
        <div id="editor-viewport" class="editor-viewport" aria-label="Editable Scroll2PDF image" hidden>
          <div id="editor-document" class="editor-document">
            <div id="editor-tile-layer" class="editor-tile-layer"></div>
            <div id="editor-interaction-layer" class="editor-interaction-layer" tabindex="0" aria-label="Image editing canvas">
              <div id="editor-selection" class="editor-selection" hidden>
                <span class="editor-selection__handle editor-selection__handle--nw" data-resize-handle="nw" aria-hidden="true"></span>
                <span class="editor-selection__handle editor-selection__handle--ne" data-resize-handle="ne" aria-hidden="true"></span>
                <span class="editor-selection__handle editor-selection__handle--sw" data-resize-handle="sw" aria-hidden="true"></span>
                <span class="editor-selection__handle editor-selection__handle--se" data-resize-handle="se" aria-hidden="true"></span>
              </div>
              <div id="editor-structure-draft" class="editor-structure-draft" aria-hidden="true" hidden>
                <span id="editor-structure-label" class="editor-structure-draft__label"></span>
              </div>
              <button id="editor-text-drag-handle" class="editor-text-drag-handle" type="button" aria-label="Move text" title="Drag to position text" hidden>
                <span aria-hidden="true">⠿</span>
              </button>
              <textarea id="editor-text-input" class="editor-text-input" rows="2" aria-label="Annotation text" placeholder="Type a note…" hidden></textarea>
            </div>
          </div>
        </div>
        <img id="result-image" alt="Full-page Scroll2PDF capture">
      </section>
    </main>

    <script src="../utils/constants.js"></script>
    <script src="../utils/capture-utils.js"></script>
    <script src="../utils/result-store.js"></script>
    <script src="editor-core.js"></script>
    <script src="editor-renderer.js"></script>
    <script src="editor-controller.js"></script>
    <script src="result.js"></script>
  </body>
</html>
